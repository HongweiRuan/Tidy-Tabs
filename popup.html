<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tidy Tabs</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <div class="strip" id="strip" aria-hidden="true"></div>
    <div class="meta">
      <p class="summary" id="summary"></p>
      <button class="icon-btn" id="open-settings" aria-label="Settings" title="Settings">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M2.5 4.5h6M11.5 4.5h2M2.5 11.5h2M7.5 11.5h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <circle cx="10" cy="4.5" r="1.6" stroke="currentColor" stroke-width="1.4"/>
          <circle cx="6" cy="11.5" r="1.6" stroke="currentColor" stroke-width="1.4"/>
        </svg>
      </button>
    </div>
  </header>
  <main id="main"></main>
  <script type="module" src="popup.js"></script>
</body>
</html>
